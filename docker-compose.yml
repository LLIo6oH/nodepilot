services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:///data/nodepilot.sqlite
      WORKSPACES_DIR: /workspaces
    ports:
      - "8080:8080"
    volumes:
      - nodepilot-data:/data
      - nodepilot-workspaces:/workspaces

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  nodepilot-data:
  nodepilot-workspaces:
